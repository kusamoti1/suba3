<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>かずあそび - はじめのミニゲーム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game" aria-live="polite">
      <h1>かずあそび</h1>
      <p class="subtitle">みえる ほしを かぞえて こたえよう</p>

      <section class="card" id="playArea">
        <p class="guide">⭐ を いくつ みえるかな？</p>
        <div id="itemArea" class="items" aria-label="かぞえるほし"></div>
        <div id="choices" class="choices" aria-label="こたえのせんたく"></div>
      </section>

      <section class="status">
        <p id="cheer" class="cheer hidden" aria-live="polite">✨ いいね！ ✨</p>
        <p id="feedback" class="feedback">タップして こたえよう！</p>
        <p id="progress" class="progress">もんだい 1 / 5</p>
      </section>

      <button id="retryButton" class="retry hidden">もういちど あそぶ</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
